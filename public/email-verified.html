<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email verified — Wellness Shift</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #f0f2f8 0%, #ede8ff 45%, #fff0f5 100%);
      color: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(28, 28, 30, 0.08);
      border: 1px solid rgba(140, 89, 191, 0.12);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(52, 199, 89, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      line-height: 1;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #1c1c1e;
    }
    p {
      font-size: 1rem;
      line-height: 1.55;
      color: #6c6c70;
      margin-bottom: 8px;
    }
    .highlight {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: #f3eeff;
      color: #5c2d91;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .brand {
      margin-top: 28px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8c59bf;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">✓</div>
    <h1>You're all set!</h1>
    <p>Great — your account has been verified.</p>
    <p>You can now log into the Wellness Shift app on your phone.</p>
    <div class="highlight">
      Return to the app and tap <strong>I've verified, continue</strong> to finish signing in.
    </div>
    <p class="brand">Wellness Shift</p>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <style>
      html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
      #c { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
      #status {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: rgba(255,255,255,0.85); font: 600 13px/1.4 -apple-system, system-ui, sans-serif;
        background: rgba(0,0,0,0.72); text-align: center; padding: 16px;
      }
      #hint {
        position: absolute; left: 0; right: 0; bottom: 8px;
        color: rgba(255,255,255,0.65); font: 12px/1.2 -apple-system, system-ui, sans-serif;
        text-align: center; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="status">Loading 3D model…</div>
    <div id="hint">Pinch &amp; drag to rotate · Double-tap to reset</div>
    <script src="viewer.js"></script>
  </body>
</html>
